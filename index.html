<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>网站已迁移至 micwanna.com</title>

  <link rel="canonical" href="https://micwanna.com/">
  <meta name="robots" content="noindex, follow">

  <!-- 无 JS 时的兜底跳转：5 秒后跳转 -->
  <meta http-equiv="refresh" content="5; url=https://micwanna.com/">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    p {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #94a3b8;
    }
    .domain {
      color: #38bdf8;
      font-weight: 600;
      word-break: break-all;
    }
    .countdown {
      margin: 24px 0 20px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .countdown strong {
      color: #38bdf8;
      font-size: 18px;
      margin: 0 3px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }
    .note {
      margin-top: 22px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">you chovy</div>

    <h1>褪去免费域名的浮躁，迎接81月付的光辉</h1>
    <p>新地址：<span class="domain">micwanna.com</span></p>
    <p>请更新你的收藏夹或书签，旧的地址将不再使用。</p>

    <div class="countdown">
      <strong id="count">5</strong> 秒后自动跳转…
    </div>

    <a class="btn" id="goNow" href="https://micwanna.com/">立即前往新网站</a>

    <p class="note">
      如果没有自动跳转，请点击上面的按钮，<br>
      或手动在浏览器输入 micwanna.com
    </p>
  </div>

  <script>
    (function () {
      var NEW_DOMAIN = 'https://micwanna.com';
      var SECONDS    = 5;

      // ===== 跳转目标 =====
      // ① 全部跳到新站首页（默认）
      var target = NEW_DOMAIN + '/';

      // ② 如果新站目录结构与旧站完全一致，想保留子页面路径，
      //    请注释掉上面一行，改用下面这行：
      // var target = NEW_DOMAIN + location.pathname + location.search + location.hash;

      // 按钮链接同步
      var btn = document.getElementById('goNow');
      if (btn) btn.href = target;

      // 倒计时
      var el    = document.getElementById('count');
      var left  = SECONDS;
      var timer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          jump();
          return;
        }
        if (el) el.textContent = left;
      }, 1000);

      function jump() {
        // 用 replace 避免旧页面留在浏览器历史里，防止用户按返回又跳回来
        location.replace(target);
      }

      // 兜底：即使 setInterval 被节流，也保证按时跳转
      setTimeout(jump, SECONDS * 1000 + 200);
    })();
  </script>

</body>
</html>
